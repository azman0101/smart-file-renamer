[versions]
agp = "8.13.2"
androidx_activity_compose = "1.12.2"
androidx_test = "1.7.0"
androidx_test_ext = "1.3.0"
appcompat = "1.7.1"
compile_sdk_version = "36"
compose-bom = "2025.12.01"
compose_compilerextension = "1.5.5"
constraint_layout = "2.2.1"
core_ktx = "1.17.0"
detekt = "1.23.8"
espresso_core = "3.7.0"
junit = "4.13.2"
kotlin = "2.3.0"
min_sdk_version = "23"
